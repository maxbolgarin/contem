name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install semantic-release
        # Pinned: semantic-release v25 has breaking changes, stay on the v24 line
        run: |
          npm install -g semantic-release@24.2.9
          npm install -g @semantic-release/changelog@6.0.3
          npm install -g @semantic-release/git@10.0.1
          npm install -g @semantic-release/github@11.0.6

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release@24.2.9
